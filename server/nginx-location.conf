# Add these exact locations inside the existing HTTPS server block for
# 121-78-125-73.sslip.io. This does not alter /api, /files, or other sites.
location = /autodash2-api/listing {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/autodash2-api/public/listing.php;
    fastcgi_param SCRIPT_NAME /autodash2-api/listing;
    fastcgi_read_timeout 25s;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
}

location = /autodash2-api/photo {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/autodash2-api/public/photo.php;
    fastcgi_param SCRIPT_NAME /autodash2-api/photo;
    fastcgi_read_timeout 25s;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
}

